<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FM-Lite 풋살">
<meta name="theme-color" content="#0b1424">
<title>FM-Lite 풋살 시연판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Silkscreen:wght@400;700&display=swap">
<style>
  :root { --u: 1; --pix: 'Silkscreen', 'Barlow Condensed', monospace; --cond: 'Barlow Condensed', sans-serif; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; background: #060b16; color: #fff; font-family: system-ui, sans-serif; overscroll-behavior: none; }
  body { display: grid; place-items: center; overflow: hidden; position: fixed; left: 0; top: 0; }
  #wrap { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }

  /* HUD: 스코어, 시계, 하프 / 버튼 3개 (플라잉 골키퍼는 후반 추가시간에만 켜진다) */
  #score { position: absolute; left: 50%; transform: translateX(-50%); top: calc(3px * var(--u)); height: calc(17px * var(--u)); display: flex; align-items: center; background: rgba(15, 23, 42, 0.94); border: 1px solid #1e293b; border-radius: calc(2px * var(--u)); padding: 0 calc(6px * var(--u)); z-index: 2; gap: calc(5px * var(--u)); pointer-events: none; }
  #score .name { font: 800 calc(5.5px * var(--u)) var(--pix); letter-spacing: 0.5px; }
  #score .num { font: 900 calc(8px * var(--u)) var(--pix); min-width: calc(6px * var(--u)); text-align: center; }
  #score .h { color: #38bdf8; } #score .a { color: #f87171; }
  #score .timebox { display: flex; align-items: baseline; gap: calc(2px * var(--u)); padding: calc(1.5px * var(--u)) calc(4px * var(--u)); background: #fff; color: #0f172a; font: 800 calc(6px * var(--u)) var(--pix); }
  #score .timebox.extra { background: #fde047; }
  #score .half { font: 700 calc(4.5px * var(--u)) var(--pix); color: #94a3b8; }
  #ctrl { position: absolute; right: calc(6px * var(--u)); top: calc(3px * var(--u)); display: flex; gap: calc(3px * var(--u)); z-index: 2; }
  #ctrl button { height: calc(14px * var(--u)); border: 0; border-radius: calc(2px * var(--u)); cursor: pointer; color: #fff; position: relative; overflow: hidden; }
  #btn-gk { padding: 0 calc(5px * var(--u)); background: #334155; font: 700 calc(4.6px * var(--u)) var(--pix); opacity: 0.35; }
  #btn-gk.on { background: #f59e0b; opacity: 1; }
  #btn-auto { width: calc(36px * var(--u)); background: #10b981; font: 700 calc(5px * var(--u)) var(--pix); letter-spacing: 0.5px; }
  #btn-auto::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(255,255,255,0.4); }
  #btn-auto.hold::after { width: 100%; transition: width 0.6s linear; }
  #btn-pause { width: calc(14px * var(--u)); background: #1e293b; display: grid; place-content: center; grid-auto-flow: column; gap: calc(1.5px * var(--u)); }
  #btn-pause i { width: 2px; height: calc(6px * var(--u)); min-height: 10px; background: #fff; display: block; }

  #overlay { position: absolute; inset: 0; display: none; place-items: center; background: rgba(6, 11, 22, 0.88); z-index: 4; }
  #overlay.on { display: grid; }
  #overlay .box { display: grid; gap: 8px; width: min(62%, 360px); text-align: center; }
  #overlay h2 { font: 400 clamp(18px, 5.6vw, 36px)/1.1 var(--pix); letter-spacing: 0.04em; text-transform: uppercase; }
  #overlay p { color: #cbd5e1; font-size: clamp(11px, 2.4vw, 14px); line-height: 1.5; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn { min-height: 40px; padding: 0 12px; border: 2px solid #334155; background: #0f172a; color: #fff; font: 700 clamp(10px, 2.2vw, 13px) var(--pix); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; border-radius: 3px; }
  .btn--primary { background: #10b981; border-color: #10b981; }
  .btn:active { transform: scale(0.97); }
  #err { position: fixed; left: 4px; bottom: 4px; z-index: 20; max-width: 92vw; color: #fecaca; font: 10px monospace; white-space: pre-wrap; pointer-events: none; }
  #rotate { display: none; position: fixed; inset: 0; place-items: center; background: #060b16; font: 400 16px var(--pix); letter-spacing: 0.08em; text-align: center; padding: 24px; z-index: 9; line-height: 1.8; }
  @media (orientation: portrait) { #rotate { display: grid; } }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="score"><span class="name h" id="n-h">HOME</span><span class="num" id="s-h">0</span><span class="timebox" id="timebox"><span id="s-time">00:00</span></span><span class="num" id="s-a">0</span><span class="name a" id="n-a">AWAY</span><span class="half" id="s-half">1H</span></div>
    <div id="ctrl"><button id="btn-gk" aria-label="Flying GK">GK&#8593;</button><button id="btn-auto" aria-label="SIM">SIM &#9654;&#9654;</button><button id="btn-pause" aria-label="PAUSE"><i></i><i></i></button></div>
    <div id="overlay"><div class="box"></div></div>
  </div>
  <div id="rotate">ROTATE YOUR PHONE<br><span style="font-size:11px">가로 화면으로 돌려 주세요</span></div>
  <pre id="err"></pre>
  <script>
    // 보이는 영역(visualViewport)에 16:9 화면을 딱 맞춘다
    const wrap = document.getElementById('wrap');
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
    document.body.appendChild(probe);
    function fit() {
      const c = getComputedStyle(probe); const t = parseFloat(c.paddingTop) || 0; const r = parseFloat(c.paddingRight) || 0; const b = parseFloat(c.paddingBottom) || 0; const l = parseFloat(c.paddingLeft) || 0;
      const vv = window.visualViewport; const w = vv ? vv.width : window.innerWidth; const h = vv ? vv.height : window.innerHeight;
      const s = Math.min((w - l - r) / 16, (h - t - b) / 9);
      document.body.style.height = `${h}px`; document.body.style.width = `${w}px`;
      wrap.style.width = `${16 * s}px`; wrap.style.height = `${9 * s}px`; wrap.style.maxHeight = 'none';
      wrap.style.setProperty('--u', String((16 * s) / 640));
      window.scrollTo(0, 0);
    }
    window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 250));
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
    fit(); setTimeout(fit, 400);
    const errBox = document.getElementById('err');
    window.addEventListener('error', (e) => { errBox.textContent += `${e.message} @${(e.filename || '').split('/').pop()}:${e.lineno}\n`; });
    window.addEventListener('unhandledrejection', (e) => { errBox.textContent += `${e.reason}\n`; });
  </script>
  <script type="module" src="futsal.mjs?v=p1a"></script>
</body>
</html>
