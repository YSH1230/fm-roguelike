<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#222222">
<title>FM-Lite 하이라이트 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
  :root { --team: #ff4a1c; --mute: #9a9a9a; --line: #4a4a4a; --bg: #222; --cond: 'Barlow Condensed', sans-serif; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: #fff; font-family: 'Pretendard Variable', system-ui, sans-serif; overscroll-behavior: none; }
  body { display: grid; place-items: center; overflow: hidden; }
  #wrap { position: relative; width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
  .btn { min-height: 34px; padding: 0 14px; border: 2px solid var(--line); background: rgba(34, 34, 34, 0.92); color: #fff; font: 800 clamp(11px, 2.4vw, 15px) var(--cond); letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .btn--primary { background: var(--team); border-color: var(--team); color: #000; min-height: 44px; }
  .btn:active { transform: scale(0.97); }
  #btn-auto { position: absolute; left: 1.5%; bottom: 3%; }
  #menu { position: absolute; right: 1.5%; bottom: 3%; display: flex; gap: 6px; }
  #overlay { position: absolute; inset: 0; display: none; place-items: center; background: rgba(34, 34, 34, 0.88); }
  #overlay.on { display: grid; }
  #overlay .box { display: grid; gap: 10px; width: min(60%, 340px); text-align: center; }
  #overlay h2 { font: 800 clamp(28px, 8vw, 52px)/1 var(--cond); letter-spacing: 0.04em; text-transform: uppercase; }
  #overlay p { color: #cfcfcf; font-size: clamp(12px, 2.4vw, 15px); line-height: 1.5; }
  #tunebox { position: absolute; right: 1.5%; top: 12%; display: none; width: min(44%, 260px); max-height: 62%; overflow: auto; padding: 8px 10px; background: rgba(34, 34, 34, 0.96); border: 2px solid var(--line); }
  #tunebox.on { display: grid; gap: 4px; }
  #tunebox label { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; font: 700 11px var(--cond); letter-spacing: 0.1em; color: var(--mute); text-transform: uppercase; }
  #tunebox input { grid-column: 1 / -1; width: 100%; accent-color: var(--team); }
  #rotate { display: none; position: fixed; inset: 0; place-items: center; background: var(--bg); font: 800 20px var(--cond); letter-spacing: 0.12em; text-align: center; padding: 24px; z-index: 5; }
  @media (orientation: portrait) { #rotate { display: grid; } }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="cv" width="640" height="360"></canvas>
    <button class="btn" id="btn-auto">AUTO</button>
    <div id="menu"><button class="btn" id="btn-atk">ATTACK</button><button class="btn" id="btn-def">DEFENSE</button><button class="btn" id="btn-tune">TUNE</button></div>
    <div id="tunebox"></div>
    <div id="overlay"><div class="box"></div></div>
  </div>
  <div id="rotate">ROTATE YOUR PHONE<br><span style="color:#9a9a9a;font-size:13px;font-weight:600">가로 화면으로 돌려 주세요</span></div>
  <script type="module" src="highlight.mjs"></script>
</body>
</html>
