<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>리서치 랩 스타일 샘플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
:root { --bg:#222; --panel:#2c2c2c; --line:#4a4a4a; --white:#fff; --mute:#9a9a9a; --you:#ff4a1c; --best:#b9a35a; --avg:#8d8d8d; --volt:#d4f500;
  --cond:'Barlow Condensed','Pretendard Variable',Pretendard,sans-serif; --ui:'Pretendard Variable',Pretendard,system-ui,sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#000; color:var(--white); font-family:var(--ui); display:flex; gap:18px; padding:10px; overflow-x:auto; }
.phone { flex:none; width:375px; background:var(--bg); padding:18px 18px 28px; }
.cond { font-family:var(--cond); text-transform:uppercase; }
.lab { font:600 11px/1.2 var(--cond); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
.hdr { display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:14px; border-bottom:1px dotted var(--line); }
.hdr b { font:700 13px/1 var(--cond); letter-spacing:.16em; color:var(--best); display:block; }
.hdr .r { text-align:right; }
.hdr .r span { font:700 16px/1.1 var(--cond); letter-spacing:.05em; display:block; color:var(--white); }
h1 { font:800 56px/0.95 var(--cond); text-transform:uppercase; letter-spacing:.01em; margin:18px 0 4px; }
.sub { color:var(--mute); font-size:14px; display:flex; gap:14px; align-items:center; }
.sub .tag { font:700 12px/1 var(--cond); letter-spacing:.12em; border:1px solid var(--white); padding:3px 6px; color:var(--white); }
.sec { margin-top:26px; }
.sec h2 { font:700 17px/1 var(--cond); letter-spacing:.06em; text-transform:uppercase; padding-bottom:10px; border-bottom:1px dotted var(--line); margin-bottom:14px; }
.col h3 { font:700 14px/1 var(--cond); letter-spacing:.1em; text-transform:uppercase; padding-bottom:6px; border-bottom:2px solid var(--white); margin-bottom:10px; display:flex; justify-content:space-between; }
.col h3 span { color:var(--mute); font-weight:500; }
.cmp { display:grid; gap:12px; margin-bottom:22px; }
.row .who { font:600 11px/1 var(--cond); letter-spacing:.14em; color:var(--you); }
.row.avg .who { color:var(--avg); } .row.best .who { color:var(--best); }
.row .val { display:flex; align-items:baseline; gap:6px; margin:2px 0 4px; }
.row .val b { font:700 30px/1 var(--cond); } .row.avg .val b, .row.best .val b { font-size:26px; color:#cfcfcf; } .row .val small { font:500 13px var(--cond); color:var(--mute); letter-spacing:.08em; }
.bar { height:18px; background:#1b1b1b; position:relative; }
.bar i { position:absolute; left:0; top:0; bottom:0; background:var(--you); clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%); }
.row.avg .bar i { background:var(--avg); } .row.best .bar i { background:var(--best); }
.scale { display:flex; justify-content:space-between; font:500 10px var(--cond); color:#666; margin-top:3px; letter-spacing:.06em; }
.big { text-align:center; padding:22px 0 6px; border-top:1px dotted var(--line); margin-top:26px; }
.big b { font:800 120px/0.9 var(--cond); display:block; }
.big span { color:var(--mute); font-size:15px; }
.tri { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; margin-top:18px; }
.tri b { font:700 28px/1 var(--cond); display:block; } .tri span { color:var(--mute); font-size:13px; }
.btn { display:block; width:100%; margin-top:22px; padding:15px; text-align:center; background:var(--you); color:#fff; font:800 17px/1 var(--cond); letter-spacing:.12em; text-transform:uppercase; }
.btn.o { background:transparent; border:1px solid var(--white); }
/* B */
.tabs { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); }
.tabs button { background:none; border:0; color:var(--mute); font:700 15px/1 var(--cond); letter-spacing:.1em; padding:12px 0; text-transform:uppercase; }
.tabs .on { color:#fff; box-shadow:inset 0 -3px 0 #fff; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px 8px; margin-top:22px; text-align:center; }
.badge { display:grid; justify-items:center; gap:6px; }
.shield { width:84px; height:96px; clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%); display:grid; place-items:center; position:relative; }
.shield::before { content:''; position:absolute; inset:0; background:var(--rim); }
.shield::after { content:''; position:absolute; inset:5px; background:linear-gradient(160deg,#1d1d1d 0%,#0e0e0e 100%); clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%); }
.shield svg { position:relative; z-index:1; }
.gold { --rim:linear-gradient(135deg,#fff3b0 0%,#f0c94c 22%,#b8860b 48%,#f8e58a 68%,#a67c12 100%); }
.silver { --rim:linear-gradient(135deg,#ffffff 0%,#d5dade 22%,#8d949c 48%,#eef1f3 68%,#7b828a 100%); }
.bronze { --rim:linear-gradient(135deg,#ffd9b0 0%,#dc8f50 22%,#8f4f21 48%,#f0b685 68%,#6e3a14 100%); }
.locked { --rim:linear-gradient(135deg,#4a4a4a,#333); }
.badge .tier { font:700 10px/1 var(--cond); letter-spacing:.16em; }
.badge.gold .tier { color:#e9c24d; } .badge.silver .tier { color:#c9cfd5; } .badge.bronze .tier { color:#d58a4c; } .badge.locked .tier { color:#666; }
.badge b { font:700 14px/1.1 var(--cond); letter-spacing:.04em; text-transform:uppercase; }
.badge small { color:var(--mute); font-size:12px; }
.badge .d { font-size:11px; color:#777; }
.icons { display:grid; grid-template-columns:repeat(3,1fr); gap:22px 6px; margin-top:34px; text-align:center; }
.icons div { display:grid; justify-items:center; gap:8px; color:#c9b8ff; } .icons svg { color:#d9ceff; } .icons span { font:700 14px var(--cond); letter-spacing:.06em; color:#a97cff; }
.stencil { fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:square; stroke-linejoin:miter; }
</style></head><body>
<div class="phone" id="a"></div>
<div class="phone" id="b"></div>
<script type="module">
import { createGame, startDraftPick } from '../engine/game.mjs';
import { nameOf } from '../engine/names.mjs';
const g = createGame({ seed: 7 });
for (const p of g.startDraft.pool.slice(0, 3)) startDraftPick(g, p.id);
const p = g.myTeam.stars[4];
const [last, first] = nameOf(p.id).split(' ').reverse();
const I = {
  transfer: '<path d="M4 13L13 4"/><path d="M8 4h5v5"/><path d="M20 11L11 20"/><path d="M16 20h-5v-5"/>',
  manager: '<circle cx="12" cy="8" r="4.2"/><path d="M3.5 20.5V16.5H8"/><path d="M16 16.5h4.5v4"/><path d="M10.5 16.5h3"/>',
  globe: '<path d="M7.5 3.8A7.5 7.5 0 1 1 4.6 10.5"/><path d="M12 2.5c-3.2 3-3.2 12 0 15"/><path d="M8 10h11.5"/><path d="M3.5 3.5l3 3"/><path d="M8 21.5h8M12 17.5v4"/>',
  training: '<path d="M10.5 3.5h3L18.5 19H5.5l2.2-7.5"/><path d="M9 11.5l.8-2.8"/><path d="M3 21.5h18"/>',
  condition: '<path d="M11.5 6.5C10 3.5 3.5 4 3.5 9.5c0 3.5 3.5 6.5 6.5 9"/><path d="M13 20.5l7.5-7.5c1.5-2.5 1-6.5-2-7.5s-5.5.5-6.5 3"/>',
  trophy: '<path d="M8 3.5h8v7.5a4 4 0 0 1-8 0z"/><path d="M8 5.5H3.5v4H8"/><path d="M16 5.5h4.5v4H16"/><path d="M12 15.5v4"/><path d="M7.5 21h9"/>',
};
const svg = (n, s = 56, stroke = '') => `<svg class="stencil" width="${s}" height="${s}" viewBox="0 0 24 24" ${stroke ? `style="stroke:url(#g-${stroke})"` : ''}>${I[n]}</svg>`;
const rows = (label, you, avg, best) => `<div class="col"><h3>${label}<span>PACE</span></h3><div class="cmp">
  ${[['YOU', you, ''], ['AVERAGE', avg, 'avg'], ['BEST', best, 'best']].map(([w, v, c]) => `<div class="row ${c}"><div class="who">${w}</div><div class="val"><b>${v}</b><small>/ 100</small></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}
  <div class="scale"><span>0</span><span>50</span><span>100</span></div></div></div>`;
document.getElementById('a').innerHTML = `
  <div class="hdr"><div><b>FM-LITE</b><span class="lab">PLAYER REPORT</span></div><div class="r"><span class="lab">SEASON 1</span><span>ROUND 14</span></div></div>
  <h1>${last}</h1><div class="sub"><span class="tag">${p.position}</span><span>${first}</span><span>${p.age}세</span></div>
  <div class="sec"><h2>Attributes · 능력치</h2>
    ${rows('SHOOTING 슈팅', 62, 48, 77)}
    ${rows('DRIBBLING 드리블', 54, 46, 71)}</div>
  <div class="big"><b>23</b><span>시즌 골</span></div>
  <div class="tri"><div><b>14</b><span>출전</span></div><div><b>8</b><span>도움</span></div><div><b>1.6</b><span>경기당</span></div></div>
  <div class="btn">NEXT ROUND · 다음 구간</div><div class="btn o">RETIRE · 감독 은퇴</div>`;
const badge = (ic, t, s, d, tier) => `<div class="badge ${tier}"><div class="shield">${svg(ic, 36, tier === 'locked' ? '' : tier)}</div><b>${t}</b>${s ? `<small>${s}</small>` : ''}<span class="tier">${tier === 'locked' ? 'LOCKED' : tier.toUpperCase()}${d ? ` · ${d}` : ''}</span></div>`;
document.getElementById('b').innerHTML = `
  <div class="hdr"><div><b>FM-LITE</b><span class="lab">RECORDS</span></div><div class="r"><span class="lab">CAREER</span><span>3 SEASONS</span></div></div>
  <div class="tabs" style="margin-top:14px"><button>HISTORY</button><button class="on">ACHIEVEMENTS</button><button>SEASONS</button></div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="g-gold" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="21" y2="21"><stop offset="0" stop-color="#fff3b0"/><stop offset=".3" stop-color="#f0c94c"/><stop offset=".55" stop-color="#b8860b"/><stop offset=".78" stop-color="#f8e58a"/><stop offset="1" stop-color="#a67c12"/></linearGradient>
    <linearGradient id="g-silver" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="21" y2="21"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#d5dade"/><stop offset=".55" stop-color="#8d949c"/><stop offset=".78" stop-color="#eef1f3"/><stop offset="1" stop-color="#7b828a"/></linearGradient>
    <linearGradient id="g-bronze" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="21" y2="21"><stop offset="0" stop-color="#ffd9b0"/><stop offset=".3" stop-color="#dc8f50"/><stop offset=".55" stop-color="#8f4f21"/><stop offset=".78" stop-color="#f0b685"/><stop offset="1" stop-color="#6e3a14"/></linearGradient></defs></svg>
  <div class="grid">
    ${badge('trophy', 'Champion', '3부 우승', 'YEAR 2', 'gold')}${badge('transfer', 'Promoted', '3부 → 2부', 'YEAR 2', 'silver')}${badge('manager', 'Top Scorer', 'Saito 23골', 'YEAR 1', 'silver')}
    ${badge('training', 'Fast Start', '5연승', 'YEAR 1', 'bronze')}${badge('condition', 'Iron Squad', '무패 10경기', 'YEAR 1', 'bronze')}${badge('globe', 'Champions', '', '', 'locked')}
  </div>
  <div class="icons">${['transfer', 'manager', 'globe', 'training', 'condition', 'trophy'].map((n) => `<div>${svg(n, 64)}<span>${n.toUpperCase()}</span></div>`).join('')}</div>`;
</script></body></html>
